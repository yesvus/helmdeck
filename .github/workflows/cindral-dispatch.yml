name: cindral-dispatch

on:
  workflow_dispatch:
    inputs:
      cindral_lane:
        required: true
        type: choice
        options:
          - hosted
          - fallback
          - device
          - burst
      cindral_target:
        required: false
        type: string
        default: ""
      cindral_reason:
        required: false
        type: string
        default: ""
      cindral_ref:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: cindral-${{ github.workflow }}-${{ inputs.cindral_ref || github.ref }}
  cancel-in-progress: false

jobs:
  hosted:
    if: inputs.cindral_lane == 'hosted'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.cindral_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/ci

  fallback:
    if: inputs.cindral_lane == 'fallback'
    runs-on: [self-hosted, Linux, ARM64, fallback]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.cindral_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/ci

  device:
    if: inputs.cindral_lane == 'device' && (inputs.cindral_target == 'desktop' || inputs.cindral_target == 'laptop' || inputs.cindral_target == 'phone')
    runs-on: [self-hosted, Linux, ARM64, "${{ inputs.cindral_target }}"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.cindral_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/ci

  burst:
    if: inputs.cindral_lane == 'burst'
    runs-on: [self-hosted, Linux, ARM64, burst]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.cindral_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/ci
