services:
  app:
    build:
      context: ../..
      dockerfile: examples/payload-host/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in your environment}
      HELMDECK_SESSION_SECRET: ${HELMDECK_SESSION_SECRET:?Set HELMDECK_SESSION_SECRET in your environment}
      PAYLOAD_DATABASE_URL: ${PAYLOAD_DATABASE_URL:-postgres://payload:payload@postgres:5432/payload}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload
    volumes:
      - payload-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d payload"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payload-postgres-data:
