name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:modal-geometry

  release-gate:
    name: Release gate scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm node-floor:check
      - run: pnpm surface:check
      - run: pnpm test:release

  fixtures-build:
    name: Fixtures build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:fixtures

  typecheck-example:
    name: Example host typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds dist itself before compiling the example host.
      - run: pnpm typecheck:example

  typecheck-payload-host:
    name: Payload host typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:payload-host

  typecheck-template:
    name: Template typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds dist itself before compiling the template.
      - run: pnpm typecheck:template

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build -f examples/payload-host/Dockerfile -t helmdeck-payload-host:smoke .
      - name: Start container and verify HTTP response
        run: |
          docker run -d --name helmdeck-smoke \
            -e PAYLOAD_SECRET=ci-smoke-secret-not-for-production \
            -e HELMDECK_SESSION_SECRET=ci-smoke-session-not-for-production \
            -e PAYLOAD_DATABASE_URL=file:/app/data/payload.db \
            helmdeck-payload-host:smoke
          trap 'docker logs helmdeck-smoke; docker rm -f helmdeck-smoke' EXIT
          for attempt in $(seq 1 60); do
            if docker exec helmdeck-smoke node -e "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  quality:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - lint
      - typecheck
      - test
      - release-gate
      - fixtures-build
      - typecheck-example
      - typecheck-payload-host
      - typecheck-template
      - audit
      - docker-smoke
    # Reports the legacy "quality" check name for branch protection. The umbrella states its own
    # verdict because GitHub reads a skipped check as passing, so the workflow has to run even when
    # a job above it failed and turn the umbrella red by hand.
    steps:
      - name: Turn the umbrella red when any parallel gate did not succeed
        if: ${{ needs.lint.result != 'success'
              || needs.typecheck.result != 'success'
              || needs.test.result != 'success'
              || needs.release-gate.result != 'success'
              || needs.fixtures-build.result != 'success'
              || needs.typecheck-example.result != 'success'
              || needs.typecheck-payload-host.result != 'success'
              || needs.typecheck-template.result != 'success'
              || needs.audit.result != 'success'
              || needs.docker-smoke.result != 'success' }}
        run: exit 1
      - run: echo "All harness checks passed."
