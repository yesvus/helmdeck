apiVersion: batch/v1
kind: Job
metadata:
  name: payload-host-migrate
  namespace: payload-host
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: EXAMPLE_IMAGE
          command: ["./node_modules/.bin/payload", "migrate", "--disable-transpile"]
          envFrom:
            - configMapRef:
                name: payload-host-config
            - secretRef:
                name: payload-host-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
