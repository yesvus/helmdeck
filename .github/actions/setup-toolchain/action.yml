name: Set up toolchain
description: >-
  Install pnpm and Node using the versions the checked-out commit declares, so a
  dispatched run builds that commit against the toolchain it was written for.

inputs:
  fallback-node:
    description: Node major to use when the commit predates .nvmrc
    required: false
    default: "22"
  fallback-pnpm:
    description: pnpm version to use when the commit declares no packageManager field
    required: false
    default: "12.4.1"

runs:
  using: composite
  steps:
    # Both versions live in the checked-out tree, which for a dispatched run may be an
    # older commit. Supply the documented defaults in that case so a ref predating the
    # single-source files still runs, and say so in the log rather than failing obscurely.
    - name: Resolve declared toolchain
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f .nvmrc ]; then
          echo "::warning::Checked-out commit has no .nvmrc, falling back to Node ${{ inputs.fallback-node }}."
          printf '%s\n' '${{ inputs.fallback-node }}' > .nvmrc
        fi
        # grep rather than node: this runs before actions/setup-node, so a runner without
        # Node on PATH would fail on a command-not-found under set -e.
        if grep -qE '"packageManager"[[:space:]]*:[[:space:]]*"pnpm@' package.json 2>/dev/null \
          || grep -qE '"devEngines"[[:space:]]*:' package.json 2>/dev/null; then
          # Empty makes the action resolve packageManager and devEngines itself, in its
          # own priority order. Only a commit predating both fields needs the fallback.
          echo "version=" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Checked-out commit declares no pnpm version, falling back to ${{ inputs.fallback-pnpm }}."
          echo "version=${{ inputs.fallback-pnpm }}" >> "$GITHUB_OUTPUT"
        fi

    - uses: pnpm/action-setup@v6
      with:
        version: ${{ steps.toolchain.outputs.version }}

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
