apiVersion: apps/v1
kind: Deployment
metadata:
  name: payload-host
  namespace: payload-host
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payload-host
  template:
    metadata:
      labels:
        app: payload-host
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: app
          image: EXAMPLE_IMAGE
          command: ["./node_modules/.bin/next", "start"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: payload-host-config
            - secretRef:
                name: payload-host-secrets
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
