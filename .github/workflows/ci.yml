name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  release-gate:
    name: Release gate scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm test:release

  fixtures-build:
    name: Fixtures build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:fixtures

  typecheck-example:
    name: Example host typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds dist itself before compiling the example host.
      - run: pnpm typecheck:example

  typecheck-template:
    name: Template typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds dist itself before compiling the template.
      - run: pnpm typecheck:template

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod

  quality:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - lint
      - typecheck
      - test
      - release-gate
      - fixtures-build
      - typecheck-example
      - typecheck-template
      - audit
    # Reports the legacy "quality" check name for branch protection. The umbrella states its own
    # verdict because GitHub reads a skipped check as passing, so the workflow has to run even when
    # a job above it failed and turn the umbrella red by hand.
    steps:
      - name: Turn the umbrella red when any parallel gate did not succeed
        if: ${{ needs.lint.result != 'success'
              || needs.typecheck.result != 'success'
              || needs.test.result != 'success'
              || needs.release-gate.result != 'success'
              || needs.fixtures-build.result != 'success'
              || needs.typecheck-example.result != 'success'
              || needs.typecheck-template.result != 'success'
              || needs.audit.result != 'success' }}
        run: exit 1
      - run: echo "All harness checks passed."