name: cindral-dispatch

on:
  workflow_dispatch:
    inputs:
      cindral_lane:
        required: true
        type: choice
        options:
          - hosted
          - fallback
          - device
          - burst
      cindral_target:
        required: false
        type: string
        default: ""
      cindral_reason:
        required: false
        type: string
        default: ""
      cindral_ref:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: cindral-${{ github.workflow }}-${{ inputs.cindral_ref || github.ref }}
  cancel-in-progress: false

jobs:
  hosted:
    if: inputs.cindral_lane == 'hosted'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.cindral_ref || github.ref }}
      # Inline rather than a shared action: a local action resolves inside the checked-out
      # cindral_ref workspace, where it does not exist for older refs. Versions still come
      # from .nvmrc and packageManager, with these fallbacks only for commits predating them.
      - name: Resolve declared toolchain
        id: toolchain
        run: |
          set -euo pipefail
          if [ ! -f .nvmrc ]; then
            echo "::warning::Checked-out commit has no .nvmrc, falling back to Node 22."
            printf '22\n' > .nvmrc
          fi
          # grep rather than node: this runs before actions/setup-node, so a runner with
          # no Node on PATH would fail on a command-not-found under set -e.
          if grep -qE '"packageManager"[[:space:]]*:[[:space:]]*"pnpm@' package.json 2>/dev/null \
            || grep -qE '"devEngines"[[:space:]]*:' package.json 2>/dev/null; then
            # Empty makes pnpm/action-setup resolve packageManager and devEngines itself.
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Checked-out commit declares no pnpm version, falling back to 12.4.1."
            echo "version=12.4.1" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/ci

  fallback:
    if: inputs.cindral_lane == 'fallback'
    runs-on: [self-hosted, Linux, ARM64, fallback]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.cindral_ref || github.ref }}
      # Inline rather than a shared action: a local action resolves inside the checked-out
      # cindral_ref workspace, where it does not exist for older refs. Versions still come
      # from .nvmrc and packageManager, with these fallbacks only for commits predating them.
      - name: Resolve declared toolchain
        id: toolchain
        run: |
          set -euo pipefail
          if [ ! -f .nvmrc ]; then
            echo "::warning::Checked-out commit has no .nvmrc, falling back to Node 22."
            printf '22\n' > .nvmrc
          fi
          # grep rather than node: this runs before actions/setup-node, so a runner with
          # no Node on PATH would fail on a command-not-found under set -e.
          if grep -qE '"packageManager"[[:space:]]*:[[:space:]]*"pnpm@' package.json 2>/dev/null \
            || grep -qE '"devEngines"[[:space:]]*:' package.json 2>/dev/null; then
            # Empty makes pnpm/action-setup resolve packageManager and devEngines itself.
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Checked-out commit declares no pnpm version, falling back to 12.4.1."
            echo "version=12.4.1" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/ci

  device:
    if: inputs.cindral_lane == 'device' && (inputs.cindral_target == 'desktop' || inputs.cindral_target == 'laptop' || inputs.cindral_target == 'phone')
    runs-on: [self-hosted, Linux, ARM64, "${{ inputs.cindral_target }}"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.cindral_ref || github.ref }}
      # Inline rather than a shared action: a local action resolves inside the checked-out
      # cindral_ref workspace, where it does not exist for older refs. Versions still come
      # from .nvmrc and packageManager, with these fallbacks only for commits predating them.
      - name: Resolve declared toolchain
        id: toolchain
        run: |
          set -euo pipefail
          if [ ! -f .nvmrc ]; then
            echo "::warning::Checked-out commit has no .nvmrc, falling back to Node 22."
            printf '22\n' > .nvmrc
          fi
          # grep rather than node: this runs before actions/setup-node, so a runner with
          # no Node on PATH would fail on a command-not-found under set -e.
          if grep -qE '"packageManager"[[:space:]]*:[[:space:]]*"pnpm@' package.json 2>/dev/null \
            || grep -qE '"devEngines"[[:space:]]*:' package.json 2>/dev/null; then
            # Empty makes pnpm/action-setup resolve packageManager and devEngines itself.
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Checked-out commit declares no pnpm version, falling back to 12.4.1."
            echo "version=12.4.1" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/ci

  burst:
    if: inputs.cindral_lane == 'burst'
    runs-on: [self-hosted, Linux, ARM64, burst]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.cindral_ref || github.ref }}
      # Inline rather than a shared action: a local action resolves inside the checked-out
      # cindral_ref workspace, where it does not exist for older refs. Versions still come
      # from .nvmrc and packageManager, with these fallbacks only for commits predating them.
      - name: Resolve declared toolchain
        id: toolchain
        run: |
          set -euo pipefail
          if [ ! -f .nvmrc ]; then
            echo "::warning::Checked-out commit has no .nvmrc, falling back to Node 22."
            printf '22\n' > .nvmrc
          fi
          # grep rather than node: this runs before actions/setup-node, so a runner with
          # no Node on PATH would fail on a command-not-found under set -e.
          if grep -qE '"packageManager"[[:space:]]*:[[:space:]]*"pnpm@' package.json 2>/dev/null \
            || grep -qE '"devEngines"[[:space:]]*:' package.json 2>/dev/null; then
            # Empty makes pnpm/action-setup resolve packageManager and devEngines itself.
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Checked-out commit declares no pnpm version, falling back to 12.4.1."
            echo "version=12.4.1" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/ci
