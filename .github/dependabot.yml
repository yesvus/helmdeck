version: 2
updates:
  # Grouped so a week of upstream releases arrives as one reviewable change instead of
  # a stream of single-dependency pull requests.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      # Split by name, not by dependency-type. Dependabot's npm production check only
      # covers dependencies and optionalDependencies, so every package here is classified
      # development and a production group would silently match nothing. The excluded
      # names keep each dependency in exactly one group.
      peer-ranges:
        patterns:
          - "@dnd-kit/*"
          - "@radix-ui/*"
          - lucide-react
          - motion
          - next
          - react
          - react-dom
          - tailwindcss
      build-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "@dnd-kit/*"
          - "@radix-ui/*"
          - lucide-react
          - motion
          - next
          - react
          - react-dom
          - tailwindcss
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
