name: Bug report
description: Report a reproducible defect in Helmdeck or its fixture app.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Shell
        - Primitives
        - Media workflows
        - Localization
        - Fixture app
        - Package build or distribution
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Choose the matching P0 through P3 triage tag.
      options:
        - P0 - Critical, production risk or data loss
        - P1 - High priority
        - P2 - Normal priority
        - P3 - Low priority or future enhancement
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest reliable sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: Include relevant console output or test failures.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include package version, Next.js version, React version, and operating system when relevant.
    validations:
      required: false
