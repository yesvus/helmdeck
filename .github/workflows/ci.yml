name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:release
      # The example host is the first thing a host reads, and nothing compiled it. Its dependency is
      # `link:../..`, so it follows the working tree, and a stale install here made it look pinned to
      # the previous release. That is exactly how a real staleness would have been found: by noticing
      # a version that was not the one it claimed.
      - run: pnpm typecheck:example
      # The starter template is the one thing in this repository that gets copied rather than read, so
      # nothing else may be the only place it is checked. Its script links the package into
      # `template/node_modules` itself, which is why this step needs no install of the template's own
      # dependencies the way the example's does.
      - run: pnpm typecheck:template
      - run: pnpm build:fixtures
      - run: pnpm audit --prod

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:fixtures
      - name: Install Playwright browser
        run: |
          npm i -g @playwright/cli
          npx playwright install --with-deps chromium
      - name: Start the fixture
        run: |
          pnpm exec next start fixtures -p 4319 > /tmp/fixture.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:4319/primitives; then
              echo "fixture ready"
              exit 0
            fi
            sleep 2
          done
          echo "fixture did not start" >&2
          cat /tmp/fixture.log >&2
          exit 1
      - name: Verify layout
        run: pnpm verify:layout -- --port 4319
      - name: Modal geometry
        run: pnpm test:modal-geometry
      - name: Stop the fixture
        if: always()
        run: pkill -f "next start fixtures" || true
