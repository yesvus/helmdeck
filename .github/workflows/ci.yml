name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:release
      - run: pnpm build:fixtures
      - run: pnpm audit --prod
      - name: Check the release artifact is publishable
        # The tarball npm receives is the one `pnpm pack` produces, so what is worth
        # proving is that npm accepts *that* file. Without this, an unpublished-package
        # problem surfaces during a release, after the tag and the GitHub release are
        # already pushed and the only remedy is a new version.
        #
        # Dry run only: no registry write and no credentials. The build above is what
        # puts compiled output in dist, and `prepack` re-runs the build regardless.
        run: |
          set -euo pipefail
          rm -rf .pack-check
          mkdir .pack-check
          pnpm pack --pack-destination .pack-check
          asset="$(find .pack-check -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$asset"
          npm publish "$asset" --dry-run --access public
          # A dry run does not fail on a name that is already taken, so assert the name
          # outright. This is the check that catches a scope or naming mistake before a
          # tag exists, when it costs nothing.
          test "$(node -p "require('./package.json').name")" = "@yesvus/helmdeck"
