# SPDX-License-Identifier: MIT
version: 2
updates:
  # Grouped so a week of upstream releases arrives as one reviewable change instead of
  # a stream of single-dependency pull requests.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      # Split by name, not by dependency-type. Dependabot's npm production check only
      # covers dependencies and optionalDependencies, so every package here is classified
      # development and a production group would silently match nothing. The excluded
      # names keep each dependency in exactly one group.
      #
      # Each group below is a set that has to move together. Dependabot opens one pull
      # request per group, so a blocked major in one group stalls the rest of that group
      # and nothing outside it. Keep the groups narrow enough that one blocked pair does
      # not hold up independent updates.
      peer-ranges:
        patterns:
          - "@dnd-kit/*"
          - "@radix-ui/*"
          - lucide-react
          - motion
          - next
          - react
          - react-dom
          - tailwindcss
      # These two only work together, and TypeScript 7 is currently blocked because the
      # latest typescript-eslint declares typescript ">=4.8.4 <6.1.0".
      type-pair:
        patterns:
          - typescript
          - typescript-eslint
      # Independent of the TypeScript version, so an ESLint 10 bump is not held up by a
      # blocked TypeScript bump.
      lint:
        patterns:
          - "@eslint/*"
          - eslint
          - eslint-plugin-react-hooks
          - globals
      # Tracks the runtime version rather than the build toolchain. See #84.
      node-types:
        patterns:
          - "@types/node"
      routine:
        patterns:
          - "*"
        exclude-patterns:
          - "@dnd-kit/*"
          - "@eslint/*"
          - "@radix-ui/*"
          - "@types/node"
          - eslint
          - eslint-plugin-react-hooks
          - globals
          - lucide-react
          - motion
          - next
          - react
          - react-dom
          - tailwindcss
          - typescript
          - typescript-eslint
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
